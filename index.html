<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaGO DatNet</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0ea5e9;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --chat-me: #059669;
      --chat-other: #334155;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --chat-me: #10b981;
      --chat-other: #e2e8f0;
    }

    [data-theme="neon"] {
      --bg-color: #050505;
      --card-bg: #111111;
      --accent-color: #39ff14;
      --accent-hover: #32cd32;
      --text-color: #ffffff;
      --text-muted: #888888;
      --border-color: #39ff14;
      --chat-me: #1f521d;
      --chat-other: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      padding: 1.5rem 1rem 1rem;
      text-align: center;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .status-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      background-color: rgba(14, 165, 233, 0.15);
      color: var(--accent-color);
    }

    main {
      flex: 1;
      padding: 1rem;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 1.125rem;
      margin-bottom: 0.75rem;
      color: var(--accent-color);
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }

    select, input, button {
      width: 100%;
      padding: 0.625rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
      outline: none;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .counter-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .counter-btn {
      font-size: 1.25rem;
      font-weight: bold;
      width: 3rem;
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .counter-display {
      flex: 1;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* WHATSAPP-STYLE CHAT STYLING */
    .chat-box {
      height: 320px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.1);
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chat-msg {
      max-width: 80%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      position: relative;
      word-wrap: break-word;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }

    .chat-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--border-color);
      flex-shrink: 0;
    }

    .chat-bubble-content {
      flex: 1;
    }

    .chat-msg.me {
      align-self: flex-end;
      background: var(--chat-me);
      color: #ffffff;
      border-bottom-right-radius: 0.125rem;
    }

    .chat-msg.other {
      align-self: flex-start;
      background: var(--chat-other);
      border-bottom-left-radius: 0.125rem;
    }

    .chat-msg .sender {
      font-weight: 700;
      font-size: 0.7rem;
      margin-bottom: 0.2rem;
      opacity: 0.9;
    }

    .chat-msg .meta {
      font-size: 0.65rem;
      opacity: 0.7;
      text-align: right;
      margin-top: 0.25rem;
    }

    .chat-msg .actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.25rem;
    }

    .chat-msg .action-btn {
      background: none;
      border: none;
      color: inherit;
      font-size: 0.65rem;
      cursor: pointer;
      padding: 0;
      margin: 0;
      opacity: 0.8;
      text-decoration: underline;
      width: auto;
    }

    .chat-input-container {
      display: flex;
      gap: 0.5rem;
    }

    .chat-input-container input {
      margin-bottom: 0;
    }

    .chat-input-container button {
      width: auto;
      padding: 0.625rem 1.25rem;
      margin-bottom: 0;
    }

    .profile-preview {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .profile-avatar-lg {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
    }

    nav {
      position: sticky;
      bottom: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
    }

    nav button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.5rem;
      margin: 0;
      width: auto;
    }

    nav button.active {
      color: var(--accent-color);
      font-weight: 700;
    }
  </style>
</head>
<body data-theme="dark">

  <header>
    <h1>NovaGO DatNet</h1>
    <span class="status-badge" id="appStatus">Regulärer Betrieb</span>
  </header>

  <main>
    <!-- TAB 1: Schichten -->
    <div id="tab-schichten" class="tab-content active">
      <div class="card">
        <h2>Schichtverwaltung</h2>
        <label for="shiftSelect">Aktive Schicht wählen</label>
        <select id="shiftSelect">
          <option>Frühschicht (06:00 - 14:00)</option>
          <option>Spätschicht (14:00 - 22:00)</option>
          <option>Nachtschicht (22:00 - 06:00)</option>
        </select>
        <button id="btnStartShift">Schicht starten</button>
      </div>
    </div>

    <!-- TAB 2: Zählungen -->
    <div id="tab-zaehlungen" class="tab-content">
      <div class="card">
        <h2>Fahrgastzählung (SEV)</h2>
        <div class="counter-controls">
          <button class="counter-btn" id="btnMinus">-</button>
          <span class="counter-display" id="countDisplay">0</span>
          <button class="counter-btn" id="btnPlus">+</button>
        </div>
      </div>
    </div>

    <!-- TAB 3: Team Chat -->
    <div id="tab-chat" class="tab-content">
      <div class="card">
        <h2>Team-Chat</h2>
        <div class="chat-box" id="chatBox">
          <p style="color: var(--text-muted); font-size: 0.875rem;">Lade Nachrichten...</p>
        </div>
        <div class="chat-input-container">
          <input type="text" id="chatInput" placeholder="Nachricht schreiben...">
          <button id="btnSendChat">Senden</button>
        </div>
      </div>
    </div>

    <!-- TAB 4: Profil & Einstellungen -->
    <div id="tab-profil" class="tab-content">
      <div class="card">
        <h2>Profil & Einstellungen</h2>
        
        <div id="loggedOutSection">
          <label>Benutzerkonto (Firebase)</label>
          <input type="email" id="authEmail" placeholder="E-Mail-Adresse">
          <input type="password" id="authPassword" placeholder="Passwort">
          <div style="display: flex; gap: 0.5rem;">
            <button id="btnLogin">Anmelden</button>
            <button id="btnRegister" style="background: var(--border-color);">Registrieren</button>
          </div>
        </div>

        <div id="loggedInSection" style="display: none;">
          <div class="profile-preview">
            <img id="profilePreviewImg" class="profile-avatar-lg" src="https://via.placeholder.com/60" alt="Avatar">
            <div>
              <p id="profileUserEmail" style="font-weight: 600; font-size: 0.875rem;"></p>
              <p style="font-size: 0.75rem; color: var(--accent-color);">Angemeldet</p>
            </div>
          </div>

          <label for="profileName">Anzeigename im Chat</label>
          <input type="text" id="profileName" placeholder="Dein Name (z.B. Max Mustermann)">

          <label for="profileAvatarUrl">Profilbild URL (Link zu einem Bild)</label>
          <input type="text" id="profileAvatarUrl" placeholder="https://beispiel.de/bild.jpg">

          <button id="btnSaveProfile">Profil speichern</button>
          <button id="btnLogout" style="background: #dc2626; margin-top: 0.5rem;">Abmelden</button>
        </div>

        <p id="authStatus" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.75rem;"></p>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.25rem 0;">

        <label for="themeSelect">Design-Theme wählen</label>
        <select id="themeSelect">
          <option value="dark">Standard Clean (Dark)</option>
          <option value="light">Standard Clean (Light)</option>
          <option value="neon">Neon Glow</option>
        </select>
      </div>
    </div>
  </main>

  <nav>
    <button class="nav-btn active" onclick="switchTab('schichten', this)">Schichten</button>
    <button class="nav-btn" onclick="switchTab('zaehlungen', this)">Zählungen</button>
    <button class="nav-btn" onclick="switchTab('chat', this)" id="navChatBtn">Chat</button>
    <button class="nav-btn" onclick="switchTab('profil', this)">Profil</button>
  </nav>
