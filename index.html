<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaGO DatNet</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0ea5e9;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    [data-theme="neon"] {
      --bg-color: #050505;
      --card-bg: #111111;
      --accent-color: #39ff14;
      --accent-hover: #32cd32;
      --text-color: #ffffff;
      --text-muted: #888888;
      --border-color: #39ff14;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      padding: 1.5rem 1rem 1rem;
      text-align: center;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .status-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      background-color: rgba(14, 165, 233, 0.15);
      color: var(--accent-color);
    }

    main {
      flex: 1;
      padding: 1rem;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 1.125rem;
      margin-bottom: 0.75rem;
      color: var(--accent-color);
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }

    select, input, button {
      width: 100%;
      padding: 0.625rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
      outline: none;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .counter-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .counter-btn {
      font-size: 1.25rem;
      font-weight: bold;
      width: 3rem;
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .counter-display {
      flex: 1;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav {
      position: sticky;
      bottom: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
    }

    nav button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.5rem;
      margin: 0;
      width: auto;
    }

    nav button.active {
      color: var(--accent-color);
      font-weight: 700;
    }
  </style>
</head>
<body data-theme="dark">

  <header>
    <h1>NovaGO DatNet</h1>
    <span class="status-badge" id="appStatus">Regulärer Betrieb</span>
  </header>

  <main>
    <!-- TAB 1: Schichten -->
    <div id="tab-schichten" class="tab-content active">
      <div class="card">
        <h2>Schichtverwaltung</h2>
        <label for="shiftSelect">Aktive Schicht wählen</label>
        <select id="shiftSelect">
          <option>Frühschicht (06:00 - 14:00)</option>
          <option>Spätschicht (14:00 - 22:00)</option>
          <option>Nachtschicht (22:00 - 06:00)</option>
        </select>
        <button id="btnStartShift">Schicht starten</button>
      </div>
    </div>

    <!-- TAB 2: Zählungen -->
    <div id="tab-zaehlungen" class="tab-content">
      <div class="card">
        <h2>Fahrgastzählung (SEV)</h2>
        <div class="counter-controls">
          <button class="counter-btn" id="btnMinus">-</button>
          <span class="counter-display" id="countDisplay">0</span>
          <button class="counter-btn" id="btnPlus">+</button>
        </div>
      </div>
    </div>

    <!-- TAB 3: Statistik -->
    <div id="tab-statistik" class="tab-content">
      <div class="card">
        <h2>Auswertungen & Statistik</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem;">
          Statistiken und erweiterte Analysen stehen ab 2027 zur Verfügung.
        </p>
      </div>
    </div>

    <!-- TAB 4: Owner / Einstellungen -->
    <div id="tab-owner" class="tab-content">
      <div class="card">
        <h2>Owner-Menü & Einstellungen</h2>
        <label for="themeSelect">Design-Theme wählen</label>
        <select id="themeSelect">
          <option value="dark">Standard Clean (Dark)</option>
          <option value="light">Standard Clean (Light)</option>
          <option value="neon">Neon Glow</option>
        </select>

        <h3 style="font-size: 0.875rem; margin: 1rem 0 0.5rem;">Benutzerkonto (Firebase)</h3>
        <input type="email" id="authEmail" placeholder="E-Mail-Adresse">
        <input type="password" id="authPassword" placeholder="Passwort">
        <div style="display: flex; gap: 0.5rem;">
          <button id="btnLogin">Anmelden</button>
          <button id="btnRegister" style="background: var(--border-color);">Registrieren</button>
        </div>
        <p id="authStatus" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;"></p>
      </div>
    </div>
  </main>

  <nav>
    <button class="nav-btn active" onclick="switchTab('schichten', this)">Schichten</button>
    <button class="nav-btn" onclick="switchTab('zaehlungen', this)">Zählungen</button>
    <button class="nav-btn" onclick="switchTab('statistik', this)">Statistik</button>
    <button class="nav-btn" onclick="switchTab('owner', this)">Owner</button>
  </nav>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Echte Firebase Konfiguration
    const firebaseConfig = {
      apiKey: "AIzaSyAvL5KTwN7h-fkc-tlHD7hKQRDzjRkS1Oo",
      authDomain: "novago-datnet.firebaseapp.com",
      projectId: "novago-datnet",
      storageBucket: "novago-datnet.firebasestorage.app",
      messagingSenderId: "1083028285400",
      appId: "1:1083028285400:web:549b2727dbbae306b174ad",
      measurementId: "G-GHCKHM3KC5"
    };

    // Firebase Initialisierung
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM Elemente & Variablen
    let passengerCount = 0;
    const countDisplay = document.getElementById("countDisplay");
    const themeSelect = document.getElementById("themeSelect");
    const authStatus = document.getElementById("authStatus");

    // Zähler Logik
    document.getElementById("btnPlus").addEventListener("click", () => {
      passengerCount++;
      countDisplay.textContent = passengerCount;
    });

    document.getElementById("btnMinus").addEventListener("click", () => {
      if (passengerCount > 0) passengerCount--;
      countDisplay.textContent = passengerCount;
    });

    // Theme Switcher
    themeSelect.addEventListener("change", (e) => {
      document.body.setAttribute("data-theme", e.target.value);
    });

    // Firebase Auth Logik
    document.getElementById("btnLogin").addEventListener("click", async () => {
      const email = document.getElementById("authEmail").value;
      const pass = document.getElementById("authPassword").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        authStatus.textContent = "Erfolgreich angemeldet!";
      } catch (err) {
        authStatus.textContent = "Fehler: " + err.message;
      }
    });

    document.getElementById("btnRegister").addEventListener("click", async () => {
      const email = document.getElementById("authEmail").value;
      const pass = document.getElementById("authPassword").value;
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        authStatus.textContent = "Konto erfolgreich erstellt!";
      } catch (err) {
        authStatus.textContent = "Fehler: " + err.message;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authStatus.textContent = `Angemeldet als: ${user.email}`;
      } else {
        authStatus.textContent = "Nicht angemeldet";
      }
    });
  </script>

  <script>
    // Tab Switching Navigation
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
