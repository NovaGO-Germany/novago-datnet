<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaGO DatNet</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0ea5e9;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --chat-me: #059669;
      --chat-other: #334155;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --chat-me: #10b981;
      --chat-other: #e2e8f0;
    }

    [data-theme="neon"] {
      --bg-color: #050505;
      --card-bg: #111111;
      --accent-color: #39ff14;
      --accent-hover: #32cd32;
      --text-color: #ffffff;
      --text-muted: #888888;
      --border-color: #39ff14;
      --chat-me: #1f521d;
      --chat-other: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      padding: 1.5rem 1rem 1rem;
      text-align: center;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .status-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      background-color: rgba(14, 165, 233, 0.15);
      color: var(--accent-color);
    }

    main {
      flex: 1;
      padding: 1rem;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 1.125rem;
      margin-bottom: 0.75rem;
      color: var(--accent-color);
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }

    select, input, button {
      width: 100%;
      padding: 0.625rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
      outline: none;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

      display: flex;
      gap: 0
